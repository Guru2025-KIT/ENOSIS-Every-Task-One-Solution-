  <meta charset="UTF-8">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">

  <title>enosis</title>
  <link rel="manifest" href="manifest.json">
  <script>
    window.playAudioBytes = function(base64Data, rate) {
      try {
        const binaryString = atob(base64Data);
        const len = binaryString.length;
        const bytes = new Uint8Array(len);
        for (let i = 0; i < len; i++) {
          bytes[i] = binaryString.charCodeAt(i);
        }
        const blob = new Blob([bytes], {type: 'audio/mp3'});
        const url = URL.createObjectURL(blob);
        const audio = new Audio(url);
        if (rate) {
          audio.defaultPlaybackRate = rate;
          audio.playbackRate = rate;
        }
        audio.play();
      } catch (e) {
        console.error('playAudioBytes error:', e);
      }
    }
  </script>
</head>
<body>
  <!-- Force service worker cache invalidation so browser fetches updated release bundle -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var i = 0; i < registrations.length; i++) {
          registrations[i].unregister();
        }
      });
    }
    if ('caches' in window) {
      caches.keys().then(function(names) {
        for (var i = 0; i < names.length; i++) {
          caches.delete(names[i]);
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js?v=20261018d" async></script>
</body>
