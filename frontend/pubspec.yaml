name: enosis
description: "ENOSIS — Every Task. One Solution. Unified faculty management platform."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.2
  google_fonts: ^6.2.1
  flutter_tts: ^4.0.2
  shared_preferences: ^2.2.3
  file_picker: ^12.2.0
  provider: ^6.1.1
  speech_to_text: ^7.4.0
  permission_handler: ^11.3.1
  excel: ^3.0.0
  url_launcher: ^6.3.0
  universal_html: ^2.2.4
  flutter_local_notifications: ^17.2.2
  timezone: ^0.9.4


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/

    
